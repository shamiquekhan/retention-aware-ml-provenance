name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources and scripts
        run: python -m compileall -q src tests scripts
      - name: Verify deterministic benchmark output
        run: |
          mkdir -p .ci-artifacts
          python scripts/run_benchmark.py --scenarios scenarios/pilot.json --output .ci-artifacts/pilot-a.json
          python scripts/run_benchmark.py --scenarios scenarios/pilot.json --output .ci-artifacts/pilot-b.json
          cmp .ci-artifacts/pilot-a.json .ci-artifacts/pilot-b.json
          python scripts/run_benchmark.py --scenarios scenarios/expanded.json --output .ci-artifacts/expanded.json
      - name: Check generated reports for credential-shaped values
        run: |
          ! grep -R -E '(ghp_|github_pat_|AKIA[0-9A-Z]{16}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' .ci-artifacts
